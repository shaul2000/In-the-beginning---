<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="" method="">
        <p>Username:<input type="text" required minlength="6" maxlength="10" placeholder="Set a username"></p>
        <p>Email: <input type="email" required placeholder="Enter your email address"></p>
        <p>Password: <input type="password" required minlength="7" maxlength="15" placeholder="Set password"></p>
        <p>DOB: <input type="date" required></p>
        <p>TOD: <input type="time"></p>
        <p>Age: <input type="number" min="18" max="60" required></p>
        <p>Gender: <input type="radio" name="gender" value="male"> Male <input type="radio" name="gender" value="female"> Female</p>
        <p>Favourite fruit: <input type="checkbox" name="fruit" value="apple"> Apple <input type="checkbox" name="fruit" value="banana"> Banana <input type="checkbox" name="fruit" value="orange"> Orange</p>
        <p>Age range: <input type="range" min="18" max="60" required></p>
        <p>Country: <select>
            <option value="">Select a country</option>
            <option value="ng">Nigeria</option>
            <option value="gh">Ghana</option>
            <option value="ke">Kenya</option>
            <option value="us">United States</option>
            <option value="ca">Canada</option>
            <option value="uk">United Kingdom</option>
            <option value="de">Germany</option>
            <option value="fr">France</option>
            <option value="za">South Africa</option>
            <option value="eg">Egypt</option>
        </select></p>
    </form>
    
</body>
</html>
